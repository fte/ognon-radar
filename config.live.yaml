# Production config for VPS native deployment (no Docker)

api:
  title: "DarkWeb Search API"
  version: "1.0.0"
  description: "REST API for searching .onion sites via Tor network"
  host: "127.0.0.1"
  port: 8000

tor:
  proxy: "socks5h://127.0.0.1:9050"
  check_url: "https://check.torproject.org/"

crawling:
  delay: 7
  max_depth: 2
  max_pages: 50
  max_results: 10
  timeout: 30
  seed_urls:
    - "http://juhanurmihxlp77nkq76byazcldy2hlmovfu2epvl5ankdibsot4csyd.onion"
    - "http://xmh57jrknzkhv6y3ls3ubitzfqnkrwxhopf5aygthi7d6rplyvk3noyd.onion"
    - "http://tordexpmg4xy32rfp4ovnz7zq5ujoejwq2u26uxxtkscgo5u3losmeid.onion"
    - "http://haystak5njsmn2hqkewecpaxetahtwhsbsa64jom2k22z5afxhnpxfid.onion"
    - "http://notevil2ebbr5xjww6nryjta7bycbriyi2vh7an3wcuovlznvobykmad.onion"
    - "http://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion"
    - "http://p53lf57qovyuvwsc6xnrppyply3vtqm7l6pcobkmyqsiofyeznfu5uqd.onion"
    - "http://zqktlwiuavvvqqt4ybvgvi7tyo4hjl5xgfuvpdf6otjiycgwqbym2qad.onion"

retry:
  count: 3
  backoff_factor: 4

security:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0 Safari/537.36"
  api_key: ""  # Set to a strong random value before going live. Key holder = admin scope.
  # Reverse proxies whose X-Real-IP / X-Forwarded-For we accept. On this native
  # VPS nginx runs on the same host, so loopback is the whole trust boundary —
  # pinned explicitly rather than relying on the RFC1918 default, which would
  # also let any LAN peer forge its IP.
  # Moving nginx into Docker? The api service must then be reachable from a
  # bridge network, and the whole bridge subnet trusted:
  #   ["172.16.0.0/12"]   (or ["127.0.0.1/32", "::1/128", "172.16.0.0/12"])
  # and the api command needs `ports: ["8337:8000"]` removed from
  # docker-compose.yml so the port is not also published directly.
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"

cors:
  # List explicit origins, e.g. "https://your-frontend.example.com".
  # Empty list blocks all cross-origin browser requests (safe default).
  # Set to ["*"] only if this API is intentionally fully public.
  origins:
    - "*"

# Onion-Location header (advertise .onion counterpart to Tor Browser)
onion_location: "http://ognonapiw2fminc2gfof2rspipqxm3vqwgmrlprtfvab2fpzmy3viuyd.onion"

jobs:
  max_workers: 2
  db_path: "ognon-jobs/jobs.db"

webhook:
  max_attempts: 3
  retry_delay: 5
  timeout: 10
  db_path: "ognon-jobs/webhooks.db"
  allow_insecure_urls: false
