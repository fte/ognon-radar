# DarkWeb API Configuration

# API Settings
api:
  title: "DarkWeb Search API"
  version: "1.0.0"
  description: "REST API for searching .onion sites via Tor network"
  host: "0.0.0.0"
  port: 8000

# Tor Configuration
tor:
  proxy: "socks5h://tor:9050"
  check_url: "https://check.torproject.org/"
  control_host: "tor"
  control_port: 9051
  # Password is read from TOR_CONTROL_PASSWORD env var (set in docker-compose.yml).
  # Keep this empty; the value in docker-compose.yml must match.
  control_password: ""

# Crawling Settings
crawling:
  delay: 3  # Seconds between requests
  max_depth: 2
  max_pages: 50
  max_results: 10
  timeout: 15  # Request timeout in seconds
  
  # Default seed URLs for crawling (well-known .onion sites)
  seed_urls:
    # Search engines
    - "http://juhanurmihxlp77nkq76byazcldy2hlmovfu2epvl5ankdibsot4csyd.onion"  # Ahmia
    - "http://xmh57jrknzkhv6y3ls3ubitzfqnkrwxhopf5aygthi7d6rplyvk3noyd.onion"  # Torch
    - "http://tordexpmg4xy32rfp4ovnz7zq5ujoejwq2u26uxxtkscgo5u3losmeid.onion"  # TorDex
    - "http://haystak5njsmn2hqkewecpaxetahtwhsbsa64jom2k22z5afxhnpxfid.onion"  # Haystak
    - "http://notevil2ebbr5xjww6nryjta7bycbriyi2vh7an3wcuovlznvobykmad.onion"  # Not Evil
    - "http://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion"  # DuckDuckGo
    # Directories
    - "http://p53lf57qovyuvwsc6xnrppyply3vtqm7l6pcobkmyqsiofyeznfu5uqd.onion"  # ProPublica
    - "http://zqktlwiuavvvqqt4ybvgvi7tyo4hjl5xgfuvpdf6otjiycgwqbym2qad.onion"  # Hidden Wiki

# Retry Configuration
retry:
  count: 3
  backoff_factor: 4

# Security
security:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0 Safari/537.36"
  api_key: ""  # Leave empty to disable auth (dev default). Set a value in config.live.yaml.
  # Admin access = presenting the api_key. No separate role config needed.

# CORS — intentionally wide open for public API
# This is a public API consumed from arbitrary web pages (e.g. the frontend
# at clients/www/). No private data or authenticated sessions are exposed.
# The ["*"] origin is deliberate. See config.live.yaml for the prod comment.
cors:
  origins:
    - "*"

# Onion-Location header (advertise .onion counterpart to Tor Browser)
onion_location: ""  # e.g. "http://youraddress.onion"

# Capture Settings
capture:
  backend: warc              # warc | r2 | b2 (future providers)
  output_dir: data/captures
  max_pages: 50              # Hard server-side cap on pages per capture job
  max_size_mb: 500           # Hard server-side cap on WARC file size

# Job Queue Settings
jobs:
  max_workers: 2         # Concurrent crawl threads
  db_path: "data/jobs.db"  # SQLite job store

# Rate Limiting Settings
rate_limiting:
  # Default limits act as a safety net for routes without explicit decorators.
  # Format: "<count>/<period>" e.g. "60/minute", "1000/hour".
  # Set to empty string to disable default limits (each route must opt in).
  default_limits:
    - "120/minute"
  # Backend storage: "memory://" (default, no deps), "redis://host:6379"
  storage_uri: "memory://"

# Webhook Settings
webhook:
  max_attempts: 3
  retry_delay: 5         # Seconds before first retry (doubles each attempt)
  timeout: 10            # HTTP request timeout in seconds
  db_path: "data/webhooks.db"
  allow_insecure_urls: false  # Set true in dev to allow http:// webhook URLs
