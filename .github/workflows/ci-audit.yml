name: CI — pip-audit (dependabot CVE scanner)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, deps]
  schedule:
    # Daily scan at 06:00 UTC — catches newly published CVEs
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        reqfile:
          - requirements.txt
          - requirements-crawler.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.reqfile }}

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit ${{ matrix.reqfile }}
        # pipefail so the job fails when pip-audit finds vulnerabilities
        # (exit 1), not just when it crashes. pip-audit resolves transitive
        # dependencies fresh (like a clean install), so it audits what a new
        # deployment would actually get, not a stale environment.
        #
        # Accepted risk (added 2026-09-06, review when nltk > 3.10.3 ships):
        #   --ignore-vuln PYSEC-2026-3740 — nltk file-sandbox bypass in model
        #   import/export APIs. No patched release exists yet (nltk 3.10.3 is
        #   the latest). Only exploitable when untrusted callers choose NLTK
        #   model paths with pathsec enforcement on; this app only loads
        #   bundled NLTK data, never caller-supplied model paths.
        #   REMOVE THIS FLAG as soon as nltk publishes a fix.
        run: |
          set -o pipefail
          python -m pip_audit \
            --requirement "${{ matrix.reqfile }}" \
            --desc on \
            --timeout 30 \
            --ignore-vuln PYSEC-2026-3740 \
            --format markdown \
            | tee pip-audit-report.md

      - name: Summarize to job summary
        if: always()
        run: |
          {
            echo "## 📦 pip-audit report — ${{ matrix.reqfile }}"
            echo
            if [ -s pip-audit-report.md ]; then
              cat pip-audit-report.md
            else
              echo "⚠️ No audit output produced (pip-audit crashed before writing the report)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
