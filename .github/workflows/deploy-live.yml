name: Deploy Live VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: live

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail

          missing=0
          for name in VPS_HOST VPS_PATH VPS_PATH_WWW VPS_SSH_KEY; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done

          if [[ -z "${VPS_SSH_USER:-}" ]]; then
            echo "Missing required secret: VPS_SSH_USER"
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "Secrets presence: OK"
          echo "Host length: ${#VPS_HOST}"
          echo "Path length: ${#VPS_PATH}"
          echo "WWW path length: ${#VPS_PATH_WWW}"
          ssh_user="${VPS_SSH_USER:-}"
          echo "Port value: ${VPS_SSH_PORT:-22}"
          echo "Selected user length: ${#ssh_user}"
          echo "SSH key length: ${#VPS_SSH_KEY}"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PATH_WWW: ${{ secrets.VPS_PATH_WWW }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: SSH preflight debug (fingerprint + auth test)
        run: |
          set -euo pipefail

          SSH_USER="${VPS_SSH_USER:-}"
          SSH_PORT="${VPS_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Preserve line breaks, remove potential CRLF from pasted secret.
          printf '%s\n' "$VPS_SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "Private key header: $(head -n 1 ~/.ssh/id_deploy)"
          echo "Private key footer: $(tail -n 1 ~/.ssh/id_deploy)"
          ssh-keygen -lf ~/.ssh/id_deploy

          ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          echo "Testing SSH authentication..."
          set +e
          ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$VPS_HOST" 'echo SSH_OK && whoami'
          rc=$?
          set -e

          if [[ "$rc" -ne 0 ]]; then
            echo "SSH preflight failed with code $rc"
            echo "Most likely causes:"
            echo "1) Public key not present in ~/.ssh/authorized_keys for the target user"
            echo "2) Wrong target user secret (VPS_SSH_USER)"
            echo "3) Private key in secret does not match the installed public key"
            exit "$rc"
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          debug: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_PATH }}"
            WWW_DIR="${{ secrets.VPS_PATH_WWW }}"
            BRANCH="${{ github.ref_name }}"

            if [[ ! -d "$APP_DIR" ]]; then
              echo "APP_DIR does not exist: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            if [[ ! -d .git ]]; then
              echo "Not a git repository: $APP_DIR"
              exit 1
            fi

            echo "[deploy] Syncing git branch: $BRANCH"
            git fetch --prune origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            if [[ -f scripts/deploy_live.sh ]]; then
              chmod +x scripts/deploy_live.sh
              APP_DIR="$APP_DIR" ./scripts/deploy_live.sh "$BRANCH"
            else
              echo "[deploy] scripts/deploy_live.sh not found after git sync; running inline fallback"
              python3 -m venv .venv
              .venv/bin/pip install --upgrade pip
              .venv/bin/pip install -r requirements.txt
              sudo -n systemctl daemon-reload
              sudo -n systemctl restart ognon-radar-api.service
              ready=0
              for _ in {1..30}; do
                if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then
                  ready=1
                  break
                fi
                sleep 1
              done
              if [[ "$ready" -ne 1 ]]; then
                echo "ERROR: API did not become ready on 127.0.0.1:8000 within timeout"
                sudo -n systemctl --no-pager --full status ognon-radar-api.service | sed -n '1,60p' || true
                exit 1
              fi
              echo "[deploy] Inline fallback completed"
            fi

            if [[ -z "$WWW_DIR" || "$WWW_DIR" == "/" ]]; then
              echo "Invalid WWW_DIR"
              exit 1
            fi

            if [[ ! -d "$APP_DIR/clients/www" ]]; then
              echo "Missing web client directory: clients/www"
              exit 1
            fi

            echo "[deploy] Deploying web client"
            mkdir -p "$WWW_DIR"
            find "$WWW_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$APP_DIR/clients/www/." "$WWW_DIR/"
            echo "[deploy] Web client deployed"
