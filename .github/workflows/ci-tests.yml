name: CI — Tests

on:
  push:
    branches: [main]
  pull_request:
    # `deps` so Dependabot update PRs (which target the dedicated deps
    # branch) are tested before the deps-auto-merge workflow promotes them.
    branches: [main, deps]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung container can never eat the runner's 6h limit
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build api

      - name: Run tests
        run: |
          # The Tor container starts automatically via depends_on.
          #
          # Retry once on failure: Tor bootstrap on a fresh runner can be slow
          # or hit a transient network hiccup. The tor service healthcheck no
          # longer requires an external HTTPS request (see docker-compose.yml),
          # but a clean-slate retry keeps the deps auto-merge train immune to
          # any remaining one-off infra flake. A genuinely failing test suite
          # fails twice and still goes red.
          if docker compose run --rm api python -m pytest tests/ -v; then
            exit 0
          fi
          echo "::warning::Test run failed — retrying once after a clean compose down"
          docker compose down --volumes --remove-orphans
          docker compose run --rm api python -m pytest tests/ -v

      - name: Verify OpenAPI contract is up to date
        run: |
          # The committed openapi.json/openapi.yaml must match what the app
          # actually serves. Any route or response-model change that was not
          # committed together with a regenerated contract fails here, so spec
          # drift can never land unnoticed on main or in a PR.
          #
          # --no-deps: generating the spec only imports the FastAPI app (config
          # + route modules) and opens no network connection, so starting Tor
          # would add nothing but startup flake. The repo is bind-mounted at
          # /app, so this validates the exact files under review.
          docker compose run --rm --no-deps api python scripts/gen_openapi.py --check
