# Dependencies — auto-merge to `deps`, gated by tests, then promote to `main`.
#
# Runs the day after each Dependabot batch (see .github/dependabot.yml):
#   1. Creates the `deps` branch from `main` if it does not exist.
#   2. Syncs `deps` with `main` (merge main -> deps) so the train always
#      starts from the current code of `main`.
#   3. Squash-merges every green Dependabot PR whose base is `deps`
#      (rebasing them on the `deps` head first when needed).
#   4. Runs the real test suite on the updated `deps` head
#      (same commands as ci-tests.yml).
#   5. If tests pass, opens/updates a PR `deps -> main` and squash-merges it.
#      (Note: merging to main triggers deploy-live.yml as usual.)
#   6. Dispatches the deployment explicitly when needed, because a merge
#      performed with GITHUB_TOKEN does not trigger workflow runs.
#   7. If anything could not be completed (conflict, red/pending checks,
#      failing test suite, infra error), opens or updates a GitHub issue
#      labeled `dependencies-merge-blocked` with the details. The issue is
#      closed automatically on the next fully green run.
#
# Can also be triggered manually from the Actions tab (workflow_dispatch).
#
# Required secret:
#   DEPS_TOKEN — a token allowed to write workflow files (a fine-grained PAT
#   with "Workflows: write", or a classic PAT with the `workflow` scope).
#   GITHUB_TOKEN can never be granted that permission: it has no `workflows`
#   key in its `permissions:` block, so any push or merge touching
#   `.github/workflows/**` is refused ("refusing to allow a GitHub App to
#   create or update workflow ... without `workflows` permission"). The
#   workflow falls back to GITHUB_TOKEN when the secret is missing, which is
#   enough as long as no workflow file has to be written.
name: Dependencies — auto-merge

on:
  schedule:
    # The day after each Dependabot run (1st and 15th), 09:00 UTC.
    - cron: "0 9 2,16 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Needed to dispatch deploy-live.yml and to list its runs.
  actions: write

concurrency:
  group: deps-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.DEPS_TOKEN || github.token }}
      BRANCH: deps
      LABEL: dependencies-merge-blocked

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The token must be able to write workflow files: see the header.
          token: ${{ secrets.DEPS_TOKEN || github.token }}
          # Full history: the workflow merges `main` into `deps` and compares
          # both branches by ancestry.
          fetch-depth: 0

      - name: Ensure `deps` branch exists
        run: |
          set -euo pipefail
          if git ls-remote --heads origin "$BRANCH" | grep -q "refs/heads/$BRANCH"; then
            echo "Branch '$BRANCH' already exists."
          else
            echo "Branch '$BRANCH' missing — creating it from main (via API, robust on shallow checkouts)."
            main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$BRANCH" \
              -f sha="$main_sha"
          fi

      - name: Sync `deps` with `main`
        id: sync
        run: |
          set -euo pipefail

          git fetch origin main "$BRANCH"

          # Same content on both branches: nothing to sync.
          if git diff --quiet origin/main "origin/$BRANCH"; then
            echo "'$BRANCH' has the same content as main — nothing to sync."
            exit 0
          fi

          # `main` is already contained in `deps`: nothing to sync either.
          if git merge-base --is-ancestor origin/main "origin/$BRANCH"; then
            echo "'$BRANCH' already contains main."
            exit 0
          fi

          echo "Merging main into '$BRANCH' so the train starts from the current code."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH" "origin/$BRANCH"

          # `-X theirs`: when a hunk conflicts, main wins. `deps` is only a
          # staging area for dependency bumps — the code of main must never be
          # downgraded by a stale branch. A bump dropped by this resolution
          # is re-proposed by Dependabot on the next batch.
          if ! merge_out=$(git merge --no-edit --no-ff -X theirs origin/main 2>&1); then
            echo "$merge_out"
            git merge --abort || true
            echo "::error::Could not merge main into '$BRANCH'."
            exit 1
          fi

          echo "$merge_out"

          if grep -q "CONFLICT" <<< "$merge_out"; then
            echo "::warning::main won the conflicting hunks — a dependency bump may have been dropped (Dependabot re-proposes it on the next batch)."
          fi

          if ! push_out=$(git push origin "$BRANCH" 2>&1); then
            echo "$push_out"
            if grep -q "workflows\` permission" <<< "$push_out"; then
              echo "::error::The DEPS_TOKEN secret is missing or lacks the 'workflows' permission: the sync had to update .github/workflows/ files."
            fi
            exit 1
          fi

      - name: Merge green Dependabot PRs into `deps`
        id: merge
        continue-on-error: true
        env:
          # Max time (seconds) spent waiting for a PR to become rebased and green.
          WAIT_SECONDS: 900
        run: |
          set -uo pipefail

          blocked=""
          merged_any="false"

          # Collect open Dependabot PRs targeting `deps`.
          prs=$(gh pr list \
            --base "$BRANCH" \
            --author "app/dependabot" \
            --state open \
            --json number,title,url,mergeable,mergeStateStatus \
            --limit 50)

          echo "Open Dependabot PRs:"
          echo "$prs"

          n=$(echo "$prs" | jq 'length')
          # `seq 0 -1` is not portable (GNU seq prints nothing, BSD seq counts
          # down), so the loop is guarded explicitly.
          for i in $(seq 0 $((n > 0 ? n - 1 : 0))); do
            [ "$n" -gt 0 ] || break
            num=$(echo "$prs" | jq -r ".[$i].number")
            title=$(echo "$prs" | jq -r ".[$i].title")
            url=$(echo "$prs" | jq -r ".[$i].url")

            echo "::group::PR #$num — $title ($url)"

            # Rebase the PR on the current `deps` head when it is behind.
            # GitHub computes mergeability asynchronously, so the state is
            # polled until it is settled.
            mergeable="UNKNOWN"
            mstate="UNKNOWN"
            deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              state=$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" \
                --json mergeable,mergeStateStatus --jq '"\(.mergeable) \(.mergeStateStatus)"')
              mergeable=${state%% *}
              mstate=${state##* }
              echo "mergeable=$mergeable state=$mstate"

              if [ "$mergeable" = "UNKNOWN" ]; then
                sleep 15
                continue
              fi

              if [ "$mstate" = "BEHIND" ]; then
                echo "PR is behind — requesting branch update."
                old_head=$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
                gh pr update-branch "$num" --repo "$GITHUB_REPOSITORY" || true
                # Wait for the update to land: the new head triggers a new CI run.
                while [ "$SECONDS" -lt "$deadline" ]; do
                  new_head=$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
                  if [ "$new_head" != "$old_head" ]; then
                    echo "Branch updated: ${old_head:0:8} -> ${new_head:0:8}"
                    break
                  fi
                  sleep 15
                done
                continue
              fi

              break
            done

            # Conflict check (mergeable: MERGEABLE | CONFLICTING | UNKNOWN).
            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "Not mergeable (mergeable=$mergeable) — marking blocked."
              blocked="${blocked}- PR #${num} (${title}): merge conflict with the ${BRANCH} branch — Dependabot should rebase it automatically on its next run. ${url}"$'\n'
              echo "::endgroup::"
              continue
            fi

            # Merge-state check.
            case "$mstate" in
              CLEAN|HAS_HOOKS)
                : ;;
              BLOCKED|UNSTABLE)
                blocked="${blocked}- PR #${num} (${title}): required checks failing or missing (state: ${mstate}) — see the PR checks tab. ${url}"$'\n'
                echo "::endgroup::"
                continue
                ;;
              *)
                blocked="${blocked}- PR #${num} (${title}): not mergeable (state: ${mstate}). ${url}"$'\n'
                echo "::endgroup::"
                continue
                ;;
            esac

            # All reported checks must exist and be green before merging.
            # --watch waits for the checks of the current head (a rebase
            # invalidates the previous run).
            checks_out=$(timeout "$WAIT_SECONDS" gh pr checks "$num" --repo "$GITHUB_REPOSITORY" --watch --fail-fast 2>&1)
            checks_rc=$?
            echo "$checks_out"

            if [ "$checks_rc" -ne 0 ] || grep -qiE "no (required )?checks" <<< "$checks_out"; then
              echo "Checks failing, pending, or absent — marking blocked."
              blocked="${blocked}- PR #${num} (${title}): CI checks failing, pending, or not reported (the ci-tests workflow must run on PRs targeting the ${BRANCH} branch). ${url}"$'\n'
              echo "::endgroup::"
              continue
            fi

            echo "All checks green — squash-merging."
            if merge_out=$(gh pr merge "$num" --repo "$GITHUB_REPOSITORY" --squash --delete-branch 2>&1); then
              merged_any="true"
            else
              echo "$merge_out"
              if grep -q "workflows\` permission" <<< "$merge_out"; then
                blocked="${blocked}- PR #${num} (${title}): the merge was refused because the token cannot write workflow files — the DEPS_TOKEN secret is missing or lacks the 'workflows' permission. ${url}"$'\n'
              else
                blocked="${blocked}- PR #${num} (${title}): merge command failed (see workflow logs). ${url}"$'\n'
              fi
            fi
            echo "::endgroup::"
          done

          {
            echo "merged_any=${merged_any}"
            echo "blocked<<BLOCKED_EOF"
            echo "${blocked:-none}"
            echo "BLOCKED_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Merged anything: $merged_any"
          echo "Blocked list:"
          echo "${blocked:-none}"

          # The step reports blocked PRs through its outputs, so it must not
          # fail the job by itself.
          exit 0

      - name: Check whether `deps` has something to promote
        id: pending
        run: |
          set -euo pipefail

          git fetch origin main "$BRANCH"

          # The comparison is done on the trees, not on the history: after a
          # squash-merge `deps` is never an ancestor of `main` even though
          # both hold the very same content. Comparing the trees avoids
          # promoting an empty diff over and over.
          if git diff --quiet origin/main "origin/$BRANCH"; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to promote: '$BRANCH' and main hold the same content."
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "Pending promotion: '$BRANCH' differs from main."
            git diff --stat origin/main "origin/$BRANCH"
          fi

      - name: Run test suite on `deps` (if something to promote)
        id: tests
        if: steps.pending.outputs.promote == 'true'
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          docker compose build api

          set +e
          docker compose run --rm api python -m pytest tests/ -v
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "tests_result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "tests_result=passed" >> "$GITHUB_OUTPUT"

      - name: Promote `deps` -> `main` (tests passed)
        id: promote
        if: steps.pending.outputs.promote == 'true' && steps.tests.outputs.tests_result == 'passed'
        run: |
          set -euo pipefail

          # Reuse an existing open PR from deps to main, or create one.
          existing=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Reusing existing PR #$existing (deps -> main)."
            pr_num="$existing"
          else
            pr_num=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(deps): biweekly dependency update train" \
              --body "Automated biweekly promotion of the deps branch: all Dependabot updates merged and the test suite passed on the deps head." \
              --repo "$GITHUB_REPOSITORY" | grep -oE '[0-9]+$' | tail -1)
            echo "Created PR #$pr_num (deps -> main)."
          fi

          # Wait for checks on the promotion PR only if any are reported
          # (e.g. once branch protection or required checks are configured).
          has_checks=$(gh pr view "$pr_num" --repo "$GITHUB_REPOSITORY" \
            --json statusCheckRollup --jq '(.statusCheckRollup | length) > 0')
          if [ "$has_checks" = "true" ]; then
            gh pr checks "$pr_num" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          else
            echo "No checks reported on the promotion PR — the test suite already passed on the identical deps head."
          fi

          if ! merge_out=$(gh pr merge "$pr_num" --repo "$GITHUB_REPOSITORY" --squash 2>&1); then
            echo "$merge_out"
            if grep -q "workflows\` permission" <<< "$merge_out"; then
              echo "::error::The promotion PR touches .github/workflows/ files: the DEPS_TOKEN secret is missing or lacks the 'workflows' permission."
            fi
            exit 1
          fi

      - name: Deploy `main` (a GITHUB_TOKEN merge does not trigger workflows)
        id: deploy
        if: steps.promote.outcome == 'success'
        run: |
          set -euo pipefail

          new_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "main is now at $new_sha"

          # A merge performed with GITHUB_TOKEN does not emit a push event
          # that would trigger deploy-live.yml, so the deployment has to be
          # dispatched explicitly. If a push-triggered run does show up (e.g.
          # when the merge is done with a PAT), it is left alone.
          for _ in 1 2 3 4 5 6; do
            existing_run=$(gh run list \
              --workflow deploy-live.yml \
              --branch main \
              --event push \
              --limit 10 \
              --json headSha --jq "map(select(.headSha == \"$new_sha\")) | .[0] // empty")
            if [ -n "$existing_run" ]; then
              echo "A push-triggered deploy run already exists — nothing to dispatch."
              exit 0
            fi
            sleep 10
          done

          gh workflow run deploy-live.yml --ref main
          echo "Dispatched deploy-live.yml on main."

      - name: Notify — open or update blocked issue
        # Runs when the job failed anywhere (including infra errors before
        # the merge step), OR when the job succeeded but some Dependabot
        # PRs could not be merged (partial success), OR when the deployment
        # could not be dispatched.
        if: >-
          ${{
            failure() ||
            (steps.merge.outcome != 'skipped' && steps.merge.outputs.blocked != 'none') ||
            (steps.deploy.outcome == 'failure')
          }}
        env:
          BLOCKED: ${{ steps.merge.outputs.blocked }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Build the reason. Note: no backticks anywhere here — this text is
          # interpolated into an unquoted heredoc below.
          reason="one or more Dependabot PRs could not be merged"
          if [ "$TESTS_OUTCOME" = "failure" ]; then
            reason="the test suite failed on the updated ${BRANCH} head"
          elif [ "$SYNC_OUTCOME" = "failure" ]; then
            reason="the ${BRANCH} branch could not be synced with main"
          elif [ "$PROMOTE_OUTCOME" = "failure" ]; then
            reason="the promotion PR could not be created or merged — if it touches .github/workflows/ files, the DEPS_TOKEN secret must be set with the 'workflows' permission (GITHUB_TOKEN can never be granted it)"
          elif [ "$DEPLOY_OUTCOME" = "failure" ]; then
            reason="the deployment of main could not be dispatched"
          elif [ "$BLOCKED" = "none" ] || [ -z "$BLOCKED" ]; then
            reason="workflow infrastructure error — see the run logs"
          fi

          if [ "$BLOCKED" = "none" ] || [ -z "$BLOCKED" ]; then
            blocked_section="(no specific PR details — see run logs)"
          else
            blocked_section="$BLOCKED"
          fi

          body=$(cat <<EOF
          ## ⛔ Dependency update train could not complete cleanly

          **Run:** ${RUN_URL}
          **Reason:** ${reason}
          **When:** $(date -u '+%Y-%m-%d %H:%M UTC')

          ### Blocked PRs
          ${blocked_section}

          ### What happens next
          - Merge conflicts: Dependabot rebases automatically; this will be retried on the next scheduled batch (or trigger it manually via workflow_dispatch).
          - Test failures: fix locally on a branch based on ${BRANCH}, or close the offending Dependabot PR and let the next batch retry without it.
          - This issue closes automatically on the next fully green run.

          _Maintained automatically by the deps-auto-merge workflow — one issue per failure streak._
          EOF
          )

          # Ensure the label exists (creates it if missing, updates if present).
          gh label create "$LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --color D93F0B \
            --description "Biweekly dependency merge could not complete" \
            --force

          # Reuse an open issue with the label, else create one.
          issue_num=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "$LABEL" \
            --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$issue_num" ]; then
            gh issue comment "$issue_num" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Updated existing issue #$issue_num"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --label "$LABEL" \
              --title "⛔ Dependency update train blocked — $(date -u '+%Y-%m-%d')" \
              --body "$body"
            echo "Created new blocked issue"
          fi

      - name: Close blocked issue on fully green run
        if: success() && (steps.merge.outputs.blocked == 'none' || steps.merge.outputs.blocked == '')
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue_num=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "$LABEL" \
            --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$issue_num" ]; then
            gh issue close "$issue_num" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "✅ Dependency update train completed successfully on run ${RUN_URL} — closing this issue."
            echo "Closed issue #$issue_num"
          else
            echo "No open blocked issue to close."
          fi
