[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:warcio
    ignore:Using `httpx` with `starlette.testclient`::fastapi.testclient
    # starlette testclient: anyio.abc.BlockingPortal alias deprecated (anyio >= 4.x)
    ignore::DeprecationWarning:starlette.testclient
    # slowapi: asyncio.iscoroutinefunction deprecated (removed in Python 3.16)
    ignore::DeprecationWarning:slowapi.extension
